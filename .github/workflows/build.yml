name: build-hosts

# 每天北京时间 04:17 重建一次（UTC 20:17）。
# 域名清单来自 v2fly/domain-list-community（geosite），IP 由香港/日本 DoH 现解析 + 证书探测。
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      geosite:
        description: "geosite 类别（逗号分隔）；留空用默认：geolocation-!cn,steam,epicgames,gog,github,category-games"
        required: false
        default: ""
      doh_near:
        description: "近端 DoH（逗号分隔）；留空用内置 hk-hkg + jp-kix"
        required: false
        default: ""
      max_probe:
        description: "每个域名最多探测几个 IPv4 候选"
        required: false
        default: "6"
      max_seconds:
        description: "探测阶段时间预算（秒）"
        required: false
        default: "2400"
      include_cn:
        description: "保留 @cn 国内域名（Steam 国内 CDN）：true/false"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - "aggregate.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-hosts
  cancel-in-progress: false

env:
  # 默认域名清单：全量海外 + 四个刚需类别
  # 用 category-games-!cn 而不要 category-games，后者会带上 17173/37.com 这类国内站
  DEFAULT_GEOSITE: "geolocation-!cn,steam,epicgames,gog,github,category-games-!cn"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 先体检解析器：能不能连、有没有污染、Steam/GOG 拿到的是不是亚太边缘。
      # 失败不阻断构建，但会留在日志里，方便判断该换哪个 DoH。
      - name: Resolver doctor
        continue-on-error: true
        env:
          DOH_NEAR: ${{ github.event.inputs.doh_near }}
        run: |
          if [ -n "$DOH_NEAR" ]; then
            python aggregate.py --doctor --doh-near "$DOH_NEAR"
          else
            python aggregate.py --doctor
          fi

      - name: Build hosts
        env:
          PYTHONUNBUFFERED: "1"
          DOH_NEAR: ${{ github.event.inputs.doh_near }}
          GEOSITE: ${{ github.event.inputs.geosite }}
        run: |
          CATS="${GEOSITE:-$DEFAULT_GEOSITE}"
          ARGS="--out dist --geosite $CATS --concurrency 256 --max-probe ${{ github.event.inputs.max_probe || 6 }} --max-seconds ${{ github.event.inputs.max_seconds || 2400 }}"
          if [ "${{ github.event.inputs.include_cn }}" = "true" ]; then
            ARGS="$ARGS --include-cn"
          fi
          if [ -n "$DOH_NEAR" ]; then
            ARGS="$ARGS --doh-near $DOH_NEAR"
          fi
          if [ -f domains.txt ]; then
            ARGS="$ARGS --domain-sources domains.txt"
          fi
          # 你自己用 enum_subs.py 枚举出来的子域，放进仓库后会自动并入
          if [ -f subdomains.txt ]; then
            ARGS="$ARGS --domain-list subdomains.txt"
          fi
          # manual-domains.txt / manual-hosts.txt 是默认路径，存在即生效，不用传参
          echo "运行参数: $ARGS"
          python aggregate.py $ARGS

      - name: Summary
        if: always()
        run: |
          if [ -f dist/stats.json ]; then
            echo '### 本次构建' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat dist/stats.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "hosts 行数: $(wc -l < dist/hosts.txt)" >> "$GITHUB_STEP_SUMMARY"
            echo "### 关键域名" >> "$GITHUB_STEP_SUMMARY"
            grep -E "(github\.com|store\.steampowered\.com|www\.gog\.com|epicgames\.com)$" dist/hosts.txt \
              >> "$GITHUB_STEP_SUMMARY" || echo "（有缺失）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有生成 stats.json（构建失败）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: rebuild hosts $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
